<VirtualHost *:80>
    ServerName aquila-bot.duckdns.org

    ProxyPreserveHost On

    # L'API et le site partagent le même domaine pour que le cookie de session
    # soit "same-site" partout (voir aquila-bot-le-ssl.conf en prod, où c'est
    # ce fichier qui compte réellement — certbot redirige tout vers le :443).
    ProxyPass /api http://127.0.0.1:5010/api
    ProxyPassReverse /api http://127.0.0.1:5010/api
    ProxyPass /socket.io http://127.0.0.1:5010/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:5010/socket.io

    ProxyPass / http://127.0.0.1:5011/
    ProxyPassReverse / http://127.0.0.1:5011/

    ErrorLog ${APACHE_LOG_DIR}/aquila-bot-error.log
    CustomLog ${APACHE_LOG_DIR}/aquila-bot-access.log combined
</VirtualHost>
