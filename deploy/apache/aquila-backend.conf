<VirtualHost *:80>
    ServerName aquila-backend.duckdns.org

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:5010/
    ProxyPassReverse / http://127.0.0.1:5010/

    # Socket.IO (QR code en temps réel) a besoin du support WebSocket.
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:5010/$1" [P,L]

    ErrorLog ${APACHE_LOG_DIR}/aquila-backend-error.log
    CustomLog ${APACHE_LOG_DIR}/aquila-backend-access.log combined
</VirtualHost>
